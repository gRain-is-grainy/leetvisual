<!doctype html>
<!-- Hand-written. Copies only the hooks LeetVisual reads from a leetcode.com problem page (checked 2026-10-10). -->
<html lang="en" class="light" style="color-scheme: light">
  <head>
    <title>Two Sum - LeetCode</title>
  </head>
  <body>
    <div class="flexlayout__layout">
      <div class="flexlayout__tabset" data-layout-path="/ts0">
        <div class="flexlayout__tabset_tabbar_outer flexlayout__tabset_tabbar_outer_top" data-layout-path="/ts0/tabstrip">
          <div class="flexlayout__tabset_tabbar_inner flexlayout__tabset_tabbar_inner_top">
            <div class="flexlayout__tabset_tabbar_inner_tab_container flexlayout__tabset_tabbar_inner_tab_container_top">
              <div data-layout-path="/ts0/tb0" class="flexlayout__tab_button flexlayout__tab_button_top flexlayout__tab_button--selected">
                <div class="flexlayout__tab_button_content"><div id="description_tab">Description</div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="flexlayout__tabset_content"></div>
      </div>
      <div class="flexlayout__tabset" data-layout-path="/c1/ts1">
        <div id="testcase_tabbar_outer" class="flexlayout__tabset_tabbar_outer flexlayout__tabset_tabbar_outer_top" data-layout-path="/c1/ts1/tabstrip">
          <div class="flexlayout__tabset_tabbar_inner flexlayout__tabset_tabbar_inner_top">
            <div class="flexlayout__tabset_tabbar_inner_tab_container flexlayout__tabset_tabbar_inner_tab_container_top">
              <div data-layout-path="/c1/ts1/tb0" class="flexlayout__tab_button flexlayout__tab_button_top flexlayout__tab_button--selected">
                <div class="flexlayout__tab_button_content"><div id="testcase_tab">Testcase</div></div>
              </div>
              <div data-layout-path="/c1/ts1/tb1" class="flexlayout__tab_button flexlayout__tab_button_top flexlayout__tab_button--unselected">
                <div class="flexlayout__tab_button_content"><div id="result_tab">Test Result</div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="flexlayout__tabset_content"></div>
      </div>
      <div class="flexlayout__tab" data-layout-path="/c1/ts1/t0">
        <button data-e2e-locator="console-testcase-tag">Case 1</button>
        <button data-e2e-locator="console-testcase-tag">Case 2</button>
        <div data-e2e-locator="console-testcase-input" contenteditable="true">[2,7,11,15]</div>
        <div data-e2e-locator="console-testcase-input" contenteditable="true">9</div>
        <div class="cm-editor">
          <div class="cm-content"><div class="cm-line">[2,7,11,15]</div><div class="cm-line">9</div><div class="cm-line">[3,2,4]</div><div class="cm-line">6</div></div>
        </div>
      </div>
      <div class="flexlayout__tab" data-layout-path="/c1/ts1/t1" style="display: none"></div>
    </div>
    <div><button data-e2e-locator="console-run-button" aria-label="Run">Run</button><button data-e2e-locator="console-submit-button" aria-label="Submit">Submit</button></div>
  </body>
</html>
